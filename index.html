<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Anti-Gravity Cargo Network — Next-generation logistics operations platform for cargo hubs, fleet management, route optimization, and real-time shipment tracking." />
  <title>Anti-Gravity Cargo Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div id="app" class="app-shell">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-header">
        <a href="#dashboard" class="brand" aria-label="Anti-Gravity Cargo Network home">
          <div class="brand-icon">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
              <path d="M14 2L26 8V20L14 26L2 20V8L14 2Z" fill="url(#brandGrad)" stroke="none"/>
              <path d="M14 8L20 11V17L14 20L8 17V11L14 8Z" fill="rgba(255,255,255,0.15)" stroke="none"/>
              <path d="M14 12L17 13.5V16.5L14 18L11 16.5V13.5L14 12Z" fill="white" fill-opacity="0.9"/>
              <defs>
                <linearGradient id="brandGrad" x1="2" y1="2" x2="26" y2="26" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#3b82f6"/>
                  <stop offset="1" stop-color="#1d4ed8"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">Anti-Gravity</span>
            <span class="brand-sub">Cargo Network</span>
          </div>
        </a>
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-section">
        <span class="sidebar-label">Operations</span>
        <nav class="sidebar-nav">
          <a href="#dashboard" class="nav-item" data-view="dashboard" id="nav-dashboard">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
            </span>
            <span class="nav-label">Dashboard</span>
          </a>
          <a href="#tracking" class="nav-item" data-view="tracking" id="nav-tracking">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7.5" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="9" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M9 1.5V4.5M9 13.5V16.5M1.5 9H4.5M13.5 9H16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </span>
            <span class="nav-label">Live Tracking</span>
            <span class="nav-badge" id="tracking-badge">12</span>
          </a>
          <a href="#jobs" class="nav-item" data-view="jobs" id="nav-jobs">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1.5" y="3" width="15" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M6 3V2a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="1.5"/><path d="M5 9h8M5 12h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </span>
            <span class="nav-label">Jobs</span>
            <span class="nav-badge warning" id="jobs-badge">3</span>
          </a>
          <a href="#routes" class="nav-item" data-view="routes" id="nav-routes">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 6c0-1.657 1.343-3 3-3s3 1.343 3 3c0 2.5-3 6-3 6S3 8.5 3 6Z" stroke="currentColor" stroke-width="1.5"/><circle cx="6" cy="6" r="1" fill="currentColor"/><path d="M9 13c0-1.105.895-2 2-2s2 .895 2 2c0 1.5-2 3.5-2 3.5S9 14.5 9 13Z" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="13" r=".75" fill="currentColor"/><path d="M6 12l5-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"/></svg>
            </span>
            <span class="nav-label">Routes</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-section">
        <span class="sidebar-label">Fleet & Hubs</span>
        <nav class="sidebar-nav">
          <a href="#fleet" class="nav-item" data-view="fleet" id="nav-fleet">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1" y="7" width="12" height="8" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M13 9h2l2 3v3h-4V9Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="4.5" cy="15.5" r="1.5" stroke="currentColor" stroke-width="1.5"/><circle cx="13.5" cy="15.5" r="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M1 10V5a2 2 0 0 1 2-2h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </span>
            <span class="nav-label">Fleet</span>
          </a>
          <a href="#hubs" class="nav-item" data-view="hubs" id="nav-hubs">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 1.5L16.5 6v6L9 16.5 1.5 12V6L9 1.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 6l3.75 2.25v4.5L9 15l-3.75-2.25V8.25L9 6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            </span>
            <span class="nav-label">Cargo Hubs</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-section">
        <span class="sidebar-label">Intelligence</span>
        <nav class="sidebar-nav">
          <a href="#analytics" class="nav-item" data-view="analytics" id="nav-analytics">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 14l4-5 3 3 4-6 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1" y="1" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/></svg>
            </span>
            <span class="nav-label">Analytics</span>
          </a>
          <a href="#safety" class="nav-item" data-view="safety" id="nav-safety">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 1.5L15 4.5V9c0 3.728-2.694 6.914-6 7.5C5.694 15.914 3 12.728 3 9V4.5L9 1.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6.5 9l2 2 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="nav-label">Safety</span>
            <span class="nav-badge danger" id="safety-badge">2</span>
          </a>
          <a href="#billing" class="nav-item" data-view="billing" id="nav-billing">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1" y="4" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M1 8h16" stroke="currentColor" stroke-width="1.5"/><path d="M5 11h2M12 11h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </span>
            <span class="nav-label">Billing</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <a href="#settings" class="nav-item" data-view="settings" id="nav-settings">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.227 3.227l1.414 1.414M13.36 13.36l1.413 1.413M3.227 14.773l1.414-1.414M13.36 4.64l1.413-1.413" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <span class="nav-label">Settings</span>
        </a>
        <div class="user-widget">
          <div class="user-avatar" aria-hidden="true">JR</div>
          <div class="user-info">
            <span class="user-name">James Rivera</span>
            <span class="user-role">Ops Manager</span>
          </div>
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="icon-moon">
              <path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="icon-sun" style="display:none">
              <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.42 1.42M11.54 11.54l1.41 1.41M3.05 12.95l1.42-1.42M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-area">
      <!-- Top Bar -->
      <header class="topbar" role="banner">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <div class="page-breadcrumb" id="pageBreadcrumb" aria-live="polite">
            <span class="breadcrumb-app">Anti-Gravity</span>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M4 2l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="breadcrumb-page" id="breadcrumbPage">Dashboard</span>
          </div>
        </div>
        <div class="topbar-right">
          <div class="search-box" role="search">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M10 10l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input type="search" placeholder="Search jobs, routes, vehicles…" aria-label="Search" id="globalSearch" />
            <kbd aria-label="Keyboard shortcut: Ctrl K">⌘K</kbd>
          </div>
          <button class="topbar-btn" id="alertsBtn" aria-label="Notifications (3 unread)" title="Notifications">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 1.5a5 5 0 0 1 5 5v3l1.5 3H2.5L4 9.5v-3a5 5 0 0 1 5-5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7.5 14.5a1.5 1.5 0 0 0 3 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span class="topbar-badge">3</span>
          </button>
          <button class="topbar-btn" aria-label="Help" title="Help & Documentation">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7.5" stroke="currentColor" stroke-width="1.5"/><path d="M7 6.8a2 2 0 1 1 2.5 1.9C9 9 9 9.5 9 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="12.5" r=".75" fill="currentColor"/></svg>
          </button>
          <div class="ops-status" aria-label="System status: All systems operational">
            <span class="status-dot status-green" aria-hidden="true"></span>
            <span class="ops-status-text">All Systems Go</span>
          </div>
        </div>
      </header>

      <!-- View Container -->
      <main id="viewContainer" class="view-container" role="main" aria-live="polite" tabindex="-1">
        <!-- Views are injected here by router -->
        <div class="loading-screen" id="loadingScreen" aria-label="Loading">
          <div class="loading-hex">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
              <path d="M24 4L44 14V34L24 44L4 34V14L24 4Z" stroke="#3b82f6" stroke-width="2" fill="none" class="hex-spin"/>
              <circle cx="24" cy="24" r="6" fill="#3b82f6" class="hex-pulse"/>
            </svg>
          </div>
          <p>Loading Anti-Gravity Network…</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Notification Drawer -->
  <div id="notificationDrawer" class="drawer" role="dialog" aria-label="Notifications" aria-hidden="true">
    <div class="drawer-header">
      <h2 class="drawer-title">Notifications</h2>
      <button class="drawer-close" id="closeNotifications" aria-label="Close notifications">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-content" id="notificationList"></div>
  </div>
  <div id="drawerBackdrop" class="drawer-backdrop" aria-hidden="true"></div>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <!-- Scripts: app.js is the sole entry — it imports everything -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
